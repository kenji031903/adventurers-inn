*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
.wrap{overflow-x:clip} /* 版96 頼み281: 玄関で開くと、右のふせんが少しはみ出して横に動いた（GAS の枠の中では切れて見えなかった） */
body{color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;min-height:100vh;
background-color:#3b3732;background-image:radial-gradient(ellipse at 50% 0%,#ffb35a26,transparent 60%),radial-gradient(ellipse at 50% 50%,transparent 40%,#000000a6 100%),linear-gradient(#00000059,#00000059),var(--wallimg);
background-size:100% 100%,100% 100%,auto,420px 420px;background-attachment:fixed,fixed,scroll,scroll}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
h1{font-family:"Kaisei Decol",serif;color:var(--gold2);text-align:center;letter-spacing:.18em;margin:6px 0 10px;text-shadow:0 2px 0 #000a;font-size:26px}
.xclose{position:absolute;left:10px;top:10px;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold)!important;background:#2b1a0ee6!important;color:var(--gold2);font-size:20px!important;line-height:1;z-index:9}
h1 button{background:none;border:0;font-size:14px;padding:0 4px;vertical-align:middle}
.tabs{display:flex;justify-content:center;gap:6px;margin:0 0 14px;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(#1c1915d9,#1c191500)}
.tabs button{flex:1 1 0;max-width:150px;border:2px solid #3e2614;border-radius:6px 6px 2px 2px;padding:9px 4px;font-family:"Kaisei Decol";font-size:15px;white-space:nowrap;
background:linear-gradient(#ffffff1a,#0000004d),var(--woodimg) center/260px;color:#f3e2bd;box-shadow:0 3px 6px #0008;text-shadow:0 1px 2px #000}
.tabs button.on{background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);border-color:var(--gold);text-shadow:none}
/* 一覧（依頼書の紙） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
.paper{--pc:#f1e3bd;--pe:#b99665;position:relative;cursor:pointer;padding:16px 10px 10px;font-family:"Klee One",serif;
background:linear-gradient(115deg,#ffffff38,transparent 35%,transparent 70%,#0000001f),var(--stain),var(--burn),var(--paperimg) center/100% 100% no-repeat,radial-gradient(ellipse at 50% 40%,var(--pc) 35%,var(--pe));
background-blend-mode:soft-light,normal,normal,multiply,normal;filter:drop-shadow(2px 5px 5px #0008);transform:rotate(-.7deg);transition:transform .15s;
clip-path:polygon(0 3%,6% 0,14% 2%,22% 0,31% 3%,40% 1%,52% 2%,61% 0,70% 3%,80% 1%,90% 2%,100% 0,98% 12%,100% 24%,97% 37%,100% 50%,98% 63%,100% 76%,97% 88%,100% 100%,88% 97%,76% 100%,64% 98%,52% 100%,40% 97%,28% 100%,16% 98%,6% 100%,0 97%,2% 85%,0 72%,3% 60%,0 47%,2% 34%,0 21%)}
.card{position:relative;cursor:pointer;transform:rotate(-.7deg);transition:transform .15s}.card:nth-child(even){transform:rotate(.7deg)}.card:active{transform:scale(.98)}
.card .paper{transform:none}
.paper::before,.paper::after{content:"";position:absolute;top:7px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#8a8a8a 60%,#444)}
.paper::before{left:8px}.paper::after{right:8px}
.k-魚{--pc:#cfe3f2;--pe:#6f93b3}.k-肉{--pc:#f2c9bd;--pe:#b0624c}.k-野菜{--pc:#d3e8c0;--pe:#7c9f5c}.k-その他{--pc:#f6e08e;--pe:#c29a3e}
.tw{position:relative}.thumb{width:100%;aspect-ratio:1;border-radius:6px;background:#00000014;overflow:hidden;box-shadow:inset 0 0 0 1px #5a3a1a40}
.kic{position:absolute;left:-4px;bottom:-6px;width:50px;height:50px;background:center/contain no-repeat;filter:drop-shadow(1px 2px 2px #0007);pointer-events:none}
.ic-魚{background-image:var(--ic-fish)}.ic-肉{background-image:var(--ic-meat)}.ic-野菜{background-image:var(--ic-veg)}.ic-その他{background-image:var(--ic-etc)}
.fusen{position:absolute;top:-9px;right:-10px;width:86px;height:24px;background:center/100% 100% no-repeat;transform:rotate(7deg);filter:drop-shadow(1px 2px 1px #0006);z-index:2;pointer-events:none;font:600 11px "Klee One",serif;color:#2a2a3a;display:flex;align-items:center;justify-content:center;padding-left:14px;letter-spacing:.05em}
.fu-けんじ{background-image:var(--fu-kenji)}.fu-あーちゃん{background-image:var(--fu-aachan)}
.mini{display:inline-block;width:22px;height:22px;vertical-align:-6px;background-position:center;background-size:contain;background-repeat:no-repeat}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.paper .nm{margin:8px 2px 2px;font-size:15px;line-height:1.35;text-align:center;color:#3a2510;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

// 絵が入っている枠だけ変わる。端末にしまっておいて、変わったときだけ取り直す
var SKIN = { stamp: '', slots: {} };
var SK_VARS = { '背景_石の壁': '--wallimg', '背景_木の板': '--woodimg', '背景_羊皮紙': '--paperimg', 'レシピ_魚': '--ic-fish', 'レシピ_肉': '--ic-meat', 'レシピ_野菜': '--ic-veg', 'レシピ_その他': '--ic-etc',
  'レシピ_ふせん_けんじ': '--fu-kenji', 'レシピ_ふせん_あーちゃん': '--fu-aachan' };
var SK_BTN = { 'ボタン_レシピ_ふたりの': '#tabs button[data-f=""]', 'ボタン_レシピ_けんじ': '#tabs button[data-f="けんじ"]', 'ボタン_レシピ_あーちゃん': '#tabs button[data-f="あーちゃん"]', 'ボタン_レシピ_追加': '#fab',

  '▶': 'アイコン_再生', '🍽': 'アイコン_その他の料理', '🗑': 'アイコン_消す', '💾': 'アイコン_保存', '📷': 'アイコン_写真' };
var SK_STYLE = null, SK_RX = null, SK_ICO = {};

  Object.keys(SK_VARS).forEach(function (k) { if (S[k]) root.setProperty(SK_VARS[k], 'url("' + S[k] + '")'); else root.removeProperty(SK_VARS[k]); });
  Object.keys(SK_BTN).forEach(function (k) {

    if (SK_TABS.indexOf(k) >= 0) css += sel + ':not(.on){filter:brightness(.8)}' + sel + '.on{filter:brightness(1.2) drop-shadow(0 0 6px #f0d27a)}';

  SK_ICO = {}; var ks = [];

}

$('rf').onclick = function () { $('rf').disabled = true; call('refresh').then(function (cat) { S.items = cat.items; LS.set('items', S.items); renderList(); toast('読み直したよ'); }).finally(function () { $('rf').disabled = false; }); };
// 宿の中で開いたとき: 宿の × の代わりに、ここに × を出す（宿に「閉じて」を伝える）
// Google のページは、ふだんでも2段の枠の中にある。それより深ければ、宿の中にいる。合図は上の枠みんなに送る（宿だけが聞く）
(function () {
  var ups = [], w = window;
  try { while (w !== window.top && ups.length < 10) { w = w.parent; ups.push(w); } } catch (e) { return; }
  if (ups.length <= 2) return;
  var tell = function (m) { ups.forEach(function (u) { try { u.postMessage(m, '*'); } catch (e) {} }); };
  tell('recipe-hello');
  $('xclose').classList.remove('hide');
  $('xclose').onclick = function () { tell('recipe-close'); };
})();
(function start() {
  SKIN = LS.get('skin') || SKIN; applySkin();
  S.filter = LS.get('filter') || '';
  S.items = LS.get('items') || [];
  if (S.items.length) renderList(); else { $('loading').classList.remove('hide'); }
  var BOOT = null;
  (BOOT ? Promise.resolve(BOOT) : call('boot')).then(function (b) {
    S.me = b.me; S.token = b.token; S.thumbDir = b.thumbDir; S.items = b.catalog.items; LS.set('items', S.items);
    $('loading').classList.add('hide');
    if (!S.cur && !S.edit) renderList();
    loadSkin();
    // Obsidian で直した分の見回りは、写真の読み込みのじゃまをしないよう、少しあとで
    return new Promise(function (ok) { setTimeout(ok, 2500); }).then(function () { return call('refresh'); }).then(function (cat) {
      if (JSON.stringify(cat.items) === JSON.stringify(S.items)) return;
      S.items = cat.items; LS.set('items', S.items); if (!S.cur && !S.edit) renderList();
    });
  }).catch(function (e) {
    $('loading').classList.remove('hide');
    $('loading').textContent = /NO_ACCESS|NO_USER/.test(String(e)) ? '🔒' : '…';
  });
})();
</script>
