<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冒険者の宿</title>
<meta name="theme-color" content="#3e2614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#3e2614}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#help{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font:13px sans-serif;background:#000a;color:#f3e2bd;padding:6px 12px;border-radius:14px;text-decoration:none;display:none}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwC6b56VZMl1-wjuD731Blbp-TSmAD4FKmoXgaAl1_TrFgmJKrc6wWtaSN4p2Vln-o/exec" allow="clipboard-write" title="冒険者の宿"></iframe>
<a id="help" href="https://script.google.com/macros/s/AKfycbwC6b56VZMl1-wjuD731Blbp-TSmAD4FKmoXgaAl1_TrFgmJKrc6wWtaSN4p2Vln-o/exec">うまく開かないときは、ここを押してね</a>
<script>
// 中の宿が読み込めたかは、外からは分からない。少し待ってから、逃げ道のボタンを出しておく（押さなければ邪魔しないよう、10秒で消す）
setTimeout(function () { var h = document.getElementById('help'); h.style.display = 'block'; setTimeout(function () { h.style.display = 'none'; }, 10000); }, 6000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
