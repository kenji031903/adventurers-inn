<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冒険者の宿</title>
<meta name="theme-color" content="#3e2614">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#3e2614}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#3e2614}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#start{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#3e2614ee;color:#f3e2bd;font:20px sans-serif;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#start small{font-size:13px;opacity:.75;line-height:1.6;max-width:300px}
#start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#start button{font:16px sans-serif;padding:10px 16px;border-radius:12px;border:1px solid #f3e2bd88;background:#f3e2bd;color:#3e2614;cursor:pointer}
#start button.sub{background:transparent;color:#f3e2bd}
#start b{font-size:26px;letter-spacing:.08em}
#fs{position:fixed;left:8px;bottom:8px;z-index:8;width:34px;height:34px;border:0;border-radius:10px;background:#000a;color:#f3e2bd;font:18px sans-serif;display:none;opacity:.8;transition:opacity .6s}
#fs.dim{opacity:.25}
#help{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font:13px sans-serif;background:#000a;color:#f3e2bd;padding:6px 12px;border-radius:14px;text-decoration:none;display:none}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwC6b56VZMl1-wjuD731Blbp-TSmAD4FKmoXgaAl1_TrFgmJKrc6wWtaSN4p2Vln-o/exec" allow="clipboard-write; fullscreen; autoplay; microphone *" allowfullscreen title="冒険者の宿"></iframe>
<div id="start"><b>冒険者の宿</b><span>ようこそ！</span><small>Chrome の右上の ︙ から ホーム画面に追加 をすると、次からはアイコンで、いつも画面いっぱいで開くよ（全画面の案内も出ないよ）</small><div class="row"><button id="stGo">このまま開く</button><button id="stFs" class="sub">全画面で開く</button></div></div>
<button id="fs" aria-label="全画面" title="全画面">⛶</button>
<a id="help">更新中だよ…</a>
<div id="safe"></div>
<script>
// 開いてすぐ「更新中だよ」を出し、中の宿から「読めたよ」（inn-ready）が届いたら消す。
// 15秒たっても届かないときは、押すと宿を直接開ける逃げ道の言葉に変える
var help = document.getElementById('help'), ready = false;
help.style.display = 'block';
// 画面いっぱい（2026-10-28 けんじ「カメラとナビボタンの位置まで画面を広げて」）: 宿は、カメラの帯・ナビの帯の下まで広げる。
// 中の宿からは帯の高さが分からないので、「読めたよ」が届いたら、その宿に帯の高さを知らせる（宿は、その分だけボタンや札を内側に出す）
var safeEl = document.getElementById('safe'), innWin = null;
// 版288（けんじ「ナビボタンを消しても、画面がずれる」）: 帯の高さ・幅は、横はばが同じあいだは「いちばん大きかった値」のまま減らさない（ナビを出す・消すたびに、宿のボタンの位置が動かないように）。向きが変わったら取り直す
var sfMax = null;
try { var so = JSON.parse(localStorage.getItem('inn-safe') || 'null'); if (so && so.w === window.innerWidth) sfMax = so; } catch (e) {}
function sendSafe() {
  if (!innWin) return; var cs = getComputedStyle(safeEl), w = window.innerWidth;
  var n = { w: w, t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  // 版292: ナビの帯の高さ（宿の高さを前のまま止めているぶんの縮み）を、横はばごとに覚えて、下の余白にいつも入れる（出す・消すで宿の配置が動かない）
  var ov = ifr && ifr.style.height ? Math.max(0, fz.h - window.innerHeight) : 0, nk = 'inn-navh', nh = 0;
  try { var no = JSON.parse(localStorage.getItem(nk) || 'null'); if (no && no.w === w) nh = no.h; } catch (e) {}
  if (ov > 0 && ov < 100 && ov > nh) { nh = ov; try { localStorage.setItem(nk, JSON.stringify({ w: w, h: nh })); } catch (e) {} }
  if (!nh && /Android/i.test(navigator.userAgent) && window.innerWidth < 700) nh = 48;
  n.b = Math.max(n.b, ov, nh);
  if (!sfMax || sfMax.w !== w) sfMax = n; else { ['t', 'r', 'b', 'l'].forEach(function (k) { if (n[k] > sfMax[k]) sfMax[k] = n[k]; }); }
  try { localStorage.setItem('inn-safe', JSON.stringify(sfMax)); } catch (e) {}
  try { innWin.postMessage({ inn: 'safe', t: sfMax.t, r: sfMax.r, b: sfMax.b, l: sfMax.l, mic: SR ? 1 : 0 }, '*'); } catch (e) {}
}
// 版286（けんじ「下からスワイプでナビボタンを出したとき、画面が縮むのをやめて、宿の上に重ねたい」）: 横はばが同じまま、高さだけが少し（100px未満）縮んだときは、ナビの帯が出ただけとみなして、宿の高さを縮めず前のままにする（帯は宿の上に重なる）。
// キーボードなど大きく縮むときと、向きが変わったときは、これまでどおり縮める
var ifr = document.querySelector('iframe'), fz = { w: window.innerWidth, h: window.innerHeight };
// 版287: いちばん高かったときの高さを、横はばごとに覚える。ナビの帯を出したまま開き、あとで帯を消しても、宿が伸びないように（ホーム画面から開いたときだけ）
function saveMax() { if (!installed) return; try { localStorage.setItem('inn-maxh', JSON.stringify({ w: fz.w, h: fz.h })); } catch (e) {} }
function holdHeight() {
  var w = window.innerWidth, h = window.innerHeight;
  if (w !== fz.w) { fz.w = w; fz.h = h; ifr.style.height = ''; saveMax(); return; }
  if (h >= fz.h) { fz.h = h; ifr.style.height = ''; saveMax(); return; }
  if (fz.h - h < 100) ifr.style.height = fz.h + 'px'; else ifr.style.height = '';
}
window.addEventListener('resize', holdHeight);
window.addEventListener('resize', function () { setTimeout(sendSafe, 300); });
// 版292: マイク。Google の中の枠（宿）はマイクの許可がもらえないので、外のこのページで聞き取って、文字だけを宿に送る
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, micR = null;
function micTell(o) { o.inn = 'mic'; try { if (innWin) innWin.postMessage(o, '*'); } catch (e) {} }
function micCmd(d) {
  if (d.cmd === 'stop') { try { if (micR) micR.stop(); } catch (e) {} return; }
  if (d.cmd !== 'start') return;
  if (!SR) { micTell({ ev: 'error', err: 'unsupported' }); return; }
  try { if (micR) micR.abort(); } catch (e) {}
  var r = new SR(); micR = r; r.lang = d.lang || 'ja-JP'; r.interimResults = true; r.continuous = false;
  r.onresult = function (e) { var t = '', fin = false; for (var i = 0; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) fin = true; } micTell({ ev: 'result', text: t, fin: fin }); };
  r.onerror = function (e) { micTell({ ev: 'error', err: e.error }); };
  r.onend = function () { if (micR === r) micR = null; micTell({ ev: 'end' }); };
  try { r.start(); micTell({ ev: 'start' }); } catch (e) { micTell({ ev: 'error', err: String(e) }); }
}
window.addEventListener('message', function (e) { if (e.data && e.data.inn === 'mic' && e.data.cmd) { if (!innWin) innWin = e.source; micCmd(e.data); return; } if (e.data === 'inn-ready') { ready = true; help.style.display = 'none'; innWin = e.source; sendSafe(); } });
// 逃げ道のリンクは15秒たってから（すぐ押すと、Googleの青い帯つきの直接の宿が開いてしまうため）
setTimeout(function () { if (!ready) { help.textContent = 'うまく開かないときは、ここを押してね（青い帯つきで開くよ）'; help.href = 'https://script.google.com/macros/s/AKfycbwC6b56VZMl1-wjuD731Blbp-TSmAD4FKmoXgaAl1_TrFgmJKrc6wWtaSN4p2Vln-o/exec'; } }, 15000);
// 全画面（2026-10-25 案C → 同日 直し）: ホーム画面から全画面・アプリ表示で開けたときは何も出さず、全画面の命令もしない（案内の文字が出ないように）。
// ふつうのChromeのタブで開いたときは、自分から全画面にしない（Chromeが毎回「全画面表示をやめるには」を出すため。けんじ「毎回出るのが嫌」）。
// かわりに、はじめの1回だけ「ホーム画面に追加」の案内を出す。全画面にしたいときは、案内の「全画面で開く」か ⛶ ボタンで（そのときは案内の文字が出る）
var startEl = document.getElementById('start'), fsBtn = document.getElementById('fs'), dimT;
var rootEl = document.documentElement;
var canFs = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
var installed = ['fullscreen', 'standalone', 'minimal-ui'].some(function (m) { return window.matchMedia('(display-mode: ' + m + ')').matches; }) || navigator.standalone;
function seen() { try { return localStorage.getItem('door-guide') === '1'; } catch (e) { return false; } }
function setSeen() { try { localStorage.setItem('door-guide', '1'); } catch (e) {} }
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFs() { try { var p = (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen).call(rootEl, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
function exitFs() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
function showFsUi() { fsBtn.style.display = (canFs && !installed) ? 'block' : 'none'; fsBtn.textContent = isFs() ? '\u2715' : '\u26F6'; fsBtn.classList.remove('dim'); clearTimeout(dimT); dimT = setTimeout(function () { fsBtn.classList.add('dim'); }, 4000); }
if (!installed && !seen()) startEl.style.display = 'flex';
if (!canFs) document.getElementById('stFs').style.display = 'none';
document.getElementById('stGo').addEventListener('click', function () { startEl.style.display = 'none'; setSeen(); showFsUi(); });
document.getElementById('stFs').addEventListener('click', function () { startEl.style.display = 'none'; setSeen(); enterFs(); showFsUi(); });
fsBtn.addEventListener('click', function () { if (isFs()) exitFs(); else enterFs(); });
document.addEventListener('fullscreenchange', showFsUi);
document.addEventListener('webkitfullscreenchange', showFsUi);
showFsUi();
(function () { // 開いた直後から、覚えていた高さ（100px未満だけ高いとき）に合わせる
  if (!installed) return;
  try { var o = JSON.parse(localStorage.getItem('inn-maxh') || 'null'); if (o && o.w === fz.w && o.h > fz.h && o.h - fz.h < 100) { fz.h = o.h; ifr.style.height = o.h + 'px'; } else saveMax(); } catch (e) {}
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
