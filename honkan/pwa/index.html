<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<title>冒険者の宿 本館 すぐ開く版</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3e2614">
<style>
  :root { --地: #f6efe3; --字: #3e2614; --枠: #c9b18f; --緑: #2f7d4a; --黄: #a8730a; --白: #fff; --淡: #fffaf2; }
  @media (prefers-color-scheme: dark) { :root { --地: #241710; --字: #f3e6d2; --枠: #6b5236; --緑: #7fcf98; --黄: #e6b54a; --白: #2f2017; --淡: #3a281b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--地); color: var(--字); font: 16px/1.6 "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; padding: 12px 16px 80px; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  h2 { font-size: 16px; margin: 4px 0; }
  #帯 { padding: 8px 12px; border-radius: 10px; background: var(--白); border: 1px solid var(--枠); }
  #帯[data-色="緑"] { border-color: var(--緑); color: var(--緑); }
  #帯[data-色="黄"] { border-color: var(--黄); color: var(--黄); }
  section, details { background: var(--白); border: 1px solid var(--枠); border-radius: 12px; padding: 8px 12px; margin-top: 10px; }
  summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: bold; }
  ul { margin: 0; padding-left: 20px; overflow-wrap: anywhere; }
  .小 { font-size: 13px; opacity: .8; }
  button { font: inherit; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--枠); background: var(--淡); color: var(--字); }
  #書庫 button { min-height: 40px; margin: 2px 0; text-align: left; }
  .行 { display: flex; gap: 8px; }
  #鍵の欄 { flex: 1; min-width: 0; font: inherit; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--枠); background: var(--淡); color: var(--字); }
  #本 { white-space: pre-wrap; margin-top: 6px; overflow-wrap: anywhere; }
  #本番 { width: 100%; }
</style>
</head>
<body>
<h1>冒険者の宿 本館</h1>
<div id="帯">開いているよ…</div>
<p class="小" id="速さ"></p>

<section><h2>クエストの掲示板</h2><ul id="掲示板"></ul></section>
<section data-区画="書庫"><h2>知識の書庫（本文はこのスマホの中だけ）</h2><ul id="書庫"></ul><div id="本"></div></section>
<section><button id="本番">宿の本番を開く（つながっているときだけ）</button></section>

<details id="設定の箱"><summary>⚙️ この殻の設定</summary>
  <p class="小">装い: <span id="モード"></span><br><span id="版"></span></p>
  <p class="小">宿の鍵（パソコンで作った長い合言葉。このスマホだけにしまう）: <span id="鍵の様子"></span></p>
  <div class="行"><input id="鍵の欄" type="password" autocomplete="off" placeholder="鍵をはりつける"><button id="鍵をしまう">しまう</button></div>
</details>

<script src="手もとの箱.js"></script>
<script src="殻.js"></script>
</body>
</html>
